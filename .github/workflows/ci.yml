name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm run security:dependencies
      - run: npm run language:verify
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Product performance budgets are measured on the documented reference
      # machine. Shared runners execute every deterministic unit/security test.
      - run: npm run test:deterministic
      - run: npm run compile
      - run: npx playwright install --with-deps chromium
      - name: Browser behavior tests
        # Shared runners still exercise all five 1 MiB mounts, editability, and
        # host-message behavior. The strict one-second product gate is run on
        # the documented reference Mac, where timing evidence is reproducible.
        run: npm run test:e2e
        env:
          LMV_PERFORMANCE_GATES: "off"
      - run: xvfb-run -a npm run test:integration
      - run: xvfb-run -a npm run test:integration:saves
      - run: xvfb-run -a npm run test:integration:cache-restart
      - run: xvfb-run -a npm run test:integration:restricted
      - run: npm run package
      - run: xvfb-run -a npm run test:vsix
      - name: Retain tested preview VSIX
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-markdown-vault-${{ github.sha }}
          path: local-markdown-vault-*.vsix
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm run security:dependencies
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - name: Generate CycloneDX SBOM
        run: npm run security:sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: local-markdown-vault.cdx.json
          if-no-files-found: error
